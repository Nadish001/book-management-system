{% extends 'base.html' %}
{% block content %}
<div class="content">
   <h1> home page</h1> 
   {% if messages %}
        <ul class="messages">
        {% for message in messages %}
            <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>
                {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}Important: {% endif %}
                {{ message }}
            </li>
        {% endfor %}
        </ul>
    {% endif %}
</div>

<style>
.content{
    display: flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
</style>
{% endblock %}
